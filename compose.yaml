services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sevo
      POSTGRES_PASSWORD: sevo_local
      POSTGRES_USER: sevo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sevo -d sevo"]
      interval: 2s
      timeout: 3s
      retries: 15
    ports:
      - "6432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
