name: sevomart

x-app-environment: &app-environment
  NODE_ENV: production
  SEVO_RUNTIME_ENV: development
  DATABASE_URL: postgresql://${POSTGRES_USER:-sevo}:${POSTGRES_PASSWORD:-sevo_local}@postgres:5432/${POSTGRES_DB:-sevo}
  OTP_PROVIDER: dev
  DEV_OTP_TEST_MOBILES: ${DEV_OTP_TEST_MOBILES:-09000000001,09000000002,09000000003,09000000004,09000000005}
  MINIO_ENDPOINT: minio
  MINIO_PORT: 9000
  MINIO_USE_SSL: "false"
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-sevo_local}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-sevo_local_password}
  MINIO_BUCKET: ${MINIO_BUCKET:-sevo-media}
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  SELLER_APPROVAL_RECOVERY_SECRET: ${SELLER_APPROVAL_RECOVERY_SECRET:-sevo_local_seller_approval_recovery_secret}
  PAYMENT_RECOVERY_SECRET: ${PAYMENT_RECOVERY_SECRET:-sevo_local_payment_recovery_secret}
  CART_TOKEN_DERIVATION_SECRET: ${CART_TOKEN_DERIVATION_SECRET:-sevo_local_cart_token_derivation_secret}
  DISCOVERY_CURSOR_ACTIVE_KEY_ID: ${DISCOVERY_CURSOR_ACTIVE_KEY_ID:-local-v1}
  DISCOVERY_CURSOR_KEYRING: '${DISCOVERY_CURSOR_KEYRING:-{"local-v1":"sevo_local_discovery_cursor_signing_secret"}}'
  DISCOVERY_RANKING_SECRET: ${DISCOVERY_RANKING_SECRET:-sevo_local_discovery_ranking_seed_secret}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sevo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sevo_local}
      POSTGRES_USER: ${POSTGRES_USER:-sevo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-6432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sevo_local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sevo_local_password}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9100}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9101}:9001"
    volumes:
      - minio-data:/data

  migrate:
    build:
      context: .
      dockerfile: packages/database/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sevo}:${POSTGRES_PASSWORD:-sevo_local}@postgres:5432/${POSTGRES_DB:-sevo}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  demo-seed:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: packages/database/Dockerfile
    environment:
      SEVO_RUNTIME_ENV: development
      OTP_PROVIDER: dev
      MINIO_ENDPOINT: minio
    command:
      [
        "node",
        "scripts/demo/seed.mjs",
        "--profile",
        "demo",
        "--target",
        "local",
        "--database-url",
        "postgresql://${POSTGRES_USER:-sevo}:${POSTGRES_PASSWORD:-sevo_local}@postgres:5432/${POSTGRES_DB:-sevo}",
        "--fingerprint",
        "${SEVO_DEMO_FINGERPRINT:-00000000-0000-4000-8000-000000000000}",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *app-environment
      API_PORT: 3001
      WEB_ORIGIN: http://localhost:${WEB_HOST_PORT:-3100}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 3
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3101}:3001"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      <<: *app-environment
      WORKER_PORT: 3002
      API_READINESS_URL: http://api:3001/health/ready
      INTERNAL_API_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:3001
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 3
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3100}:3000"

volumes:
  postgres-data:
  minio-data:
