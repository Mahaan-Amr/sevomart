<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>نمونه سفر خریدار سوو</title>
  <style>
    @font-face { font-family: YekanBakh; src: url('./assets/fonts/YekanBakh-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
    @font-face { font-family: YekanBakh; src: url('./assets/fonts/YekanBakh-SemiBold.woff2') format('woff2'); font-weight: 600; font-display: swap; }
    @font-face { font-family: YekanBakh; src: url('./assets/fonts/YekanBakh-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
    :root {
      color-scheme: light;
      --brand: #A41439;
      --brand-dark: #760B29;
      --brand-soft: #C9345B;
      --brand-pale: #F6E3E9;
      --paper: #F4F0F1;
      --wash: #FAF8F8;
      --ink: #2F2528;
      --muted: #81767A;
      --line: rgba(91, 66, 73, .11);
      --danger: #760B29;
      --shadow: 9px 9px 22px rgba(84,54,63,.11), -9px -9px 22px rgba(255,255,255,.9);
      --shadow-sm: 5px 5px 13px rgba(84,54,63,.10), -5px -5px 13px rgba(255,255,255,.88);
      --inset: inset 3px 3px 8px rgba(84,54,63,.09), inset -3px -3px 8px rgba(255,255,255,.85);
      font-family: YekanBakh, Tahoma, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-size: 14px; }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brand-soft); outline-offset: 3px; }
    .phone {
      width: min(100%, 470px);
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: 106px;
      background: var(--paper);
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: page-in .34s cubic-bezier(.22,.8,.28,1) both;
    }
    @keyframes page-in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    .topbar { min-height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; background: rgba(244,240,241,.94); position: sticky; top: 0; z-index: 5; backdrop-filter: blur(8px); }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; }
    .brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 10px; background: var(--brand); color: #fff; box-shadow: 3px 3px 9px rgba(164,20,57,.2), -3px -3px 8px #fff; }
    .icon-btn { border: 0; background: var(--paper); min-width: 40px; height: 40px; border-radius: 12px; color: var(--ink); box-shadow: var(--shadow-sm); transition: transform .2s ease, box-shadow .2s ease, color .2s ease; }
    .icon-btn:hover { color: var(--brand); transform: translateY(-2px); }
    .icon-btn:active { transform: none; box-shadow: var(--inset); }
    .shop-hero { padding: 16px; }
    .shop-line { display: flex; gap: 12px; align-items: center; }
    .avatar { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 18px; background: var(--brand-pale); color: var(--brand); font-size: 20px; font-weight: 700; box-shadow: var(--shadow-sm); }
    .shop-stats { display: flex; align-items: center; gap: 18px; margin: 12px 64px 0 0; direction: rtl; }
    .shop-stat { display: inline-flex; align-items: center; gap: 5px; color: var(--ink); font-size: 12px; font-weight: 600; white-space: nowrap; }
    .shop-stat + .shop-stat { padding-right: 16px; border-right: 1px solid var(--line); }
    .shop-stat svg { width: 16px; height: 16px; fill: none; stroke: var(--brand); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: 22px; line-height: 1.65; margin-bottom: 4px; }
    h2 { font-size: 18px; line-height: 1.7; }
    .muted { color: var(--muted); font-size: 13px; line-height: 1.8; }
    .pay-badge { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; margin-top: 12px; border: 0; background: var(--brand-pale); color: var(--brand); border-radius: 999px; padding: 4px 12px; font-size: 11px; font-weight: 600; }
    .pay-badge::before { content: "↗"; display: grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; background: var(--wash); }
    .section { padding: 16px; }
    .section-head { display: flex; align-items: end; justify-content: space-between; margin-bottom: 12px; }
    .section-head h2 { margin: 0; }
    .link { display: inline-flex; align-items: center; min-height: 40px; border: 0; padding: 0 6px; background: transparent; color: var(--brand); font-size: 12px; }
    .profile-grid-section { padding-top: 4px; border-top: 1px solid var(--line); }
    .profile-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; }
    .post-tile { position: relative; width: 100%; min-width: 0; aspect-ratio: 1; border: 0; border-radius: 0; padding: 0; overflow: hidden; background: var(--wash); }
    .post-tile:focus-visible { outline-offset: -4px; z-index: 2; }
    .post-art { position: absolute; inset: 0; background: linear-gradient(145deg, #eadfe2, #faf6f7); transition: transform .22s cubic-bezier(.22,.8,.28,1); }
    .post-tile:hover .post-art { transform: scale(1.025); }
    .post-art::after { content: ""; position: absolute; inset: 20% 28% 9%; border-radius: 48% 48% 16% 16%; background: var(--brand); box-shadow: inset 0 0 0 8px rgba(255,255,255,.12); }
    .post-tile:nth-child(2n) .post-art { background: linear-gradient(145deg, #e4d6da, #f6eef0); }
    .post-tile:nth-child(2n) .post-art::after { background: var(--brand-dark); border-radius: 45% 45% 10px 10px; }
    .post-tile:nth-child(3n) .post-art { background: linear-gradient(145deg, var(--brand-pale), #faf8f8); }
    .post-tile:nth-child(3n) .post-art::after { inset: 12% 22% 12%; border-radius: 44% 44% 24% 24%; background: var(--brand-soft); }
    .post-tile:nth-child(4n) .post-art::after { inset: 28% 18% 12%; border-radius: 50% 50% 14px 14px; }
    .price { margin-top: 4px; font-weight: 700; font-size: 14px; color: var(--brand); }
    .surface { margin: 0 16px 14px; padding: 16px; border: 1px solid var(--line); border-radius: 20px; background: var(--paper); box-shadow: var(--shadow-sm); }
    .post-media { width: 100%; aspect-ratio: 1; background: linear-gradient(145deg, #e4d6da, #faf6f7); position: relative; overflow: hidden; box-shadow: var(--inset); }
    .post-media::after { content: ""; position: absolute; inset: 16% 29% 7%; border-radius: 48% 48% 16% 16%; background: var(--brand); box-shadow: inset 0 0 0 18px rgba(255,255,255,.12); }
    .media-dots { position: absolute; inset-inline: 0; bottom: 12px; z-index: 2; display: flex; direction: ltr; justify-content: center; gap: 5px; }
    .media-dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.65); box-shadow: 0 1px 4px rgba(47,37,40,.18); }
    .media-dots i.active { width: 16px; border-radius: 99px; background: #fff; }
    .post-caption { padding: 16px; }
    .caption-shop { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 13px; }
    .caption-avatar { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; background: var(--brand-pale); color: var(--brand); font-weight: 700; }
    .caption-copy { margin-bottom: 14px; color: var(--ink); font-size: 13px; line-height: 1.9; }
    .attached-product { padding: 14px; border-radius: 18px; background: var(--paper); box-shadow: var(--shadow-sm); }
    .attached-label { color: var(--muted); font-size: 11px; font-weight: 600; }
    .attached-heading { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin: 4px 0 12px; }
    .attached-heading h1 { margin: 0; font-size: 18px; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { min-width: 44px; min-height: 38px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); padding: 7px 11px; box-shadow: var(--shadow-sm); }
    .chip.active { border-color: var(--brand); background: var(--brand-pale); color: var(--brand-dark); font-weight: 600; box-shadow: var(--inset); }
    .primary, .secondary { border-radius: 13px; min-height: 42px; padding: 0 18px; font-weight: 600; width: 100%; transition: transform .2s ease, box-shadow .2s ease, background .2s ease; }
    .primary { border: 0; color: white; background: var(--brand); box-shadow: 5px 7px 15px rgba(164,20,57,.18), -3px -3px 10px rgba(255,255,255,.75); }
    .primary:hover { background: var(--brand-dark); transform: translateY(-2px); }
    .primary:active { transform: none; box-shadow: var(--inset); }
    .secondary { border: 1px solid var(--line); color: var(--ink); background: var(--paper); box-shadow: var(--shadow-sm); }
    .secondary:active { box-shadow: var(--inset); }
    .sticky-action { position: sticky; bottom: 86px; display: flex; gap: 10px; padding: 10px 16px; background: rgba(244,240,241,.96); z-index: 4; backdrop-filter: blur(8px); }
    .cart-row { display: grid; grid-template-columns: 68px 1fr auto; gap: 12px; align-items: center; }
    .thumb { height: 68px; border-radius: 16px; background: linear-gradient(145deg, #eadfe2, var(--brand)); box-shadow: var(--inset); }
    .qty { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 6px; }
    .qty button { width: 40px; height: 40px; border: 0; border-radius: 11px; background: var(--paper); box-shadow: var(--shadow-sm); }
    .totals { display: grid; gap: 10px; margin-top: 18px; border-top: 1px dashed var(--line); padding-top: 14px; }
    .total-line { display: flex; justify-content: space-between; }
    .total-line.final { font-weight: 700; font-size: 16px; }
    .field { display: grid; gap: 7px; margin: 14px 0; }
    .field label { font-size: 11px; color: var(--muted); font-weight: 600; }
    .field input { min-height: 43px; border: 0; border-radius: 13px; padding: 0 13px; direction: rtl; background: var(--paper); color: var(--ink); box-shadow: var(--inset); }
    .otp { direction: ltr !important; text-align: center; letter-spacing: 8px; font-size: 22px; }
    .step-list { display: grid; gap: 10px; }
    .checkout-step { border: 1px solid var(--line); border-radius: 18px; background: var(--paper); overflow: hidden; box-shadow: var(--shadow-sm); }
    .checkout-title { width: 100%; border: 0; background: var(--paper); min-height: 52px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; font-weight: 600; }
    .step-number { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; color: white; background: var(--brand); font-size: 12px; }
    .checkout-body { padding: 0 15px 15px; }
    .choice { width: 100%; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); padding: 11px 13px; display: flex; justify-content: space-between; text-align: right; margin-top: 8px; box-shadow: var(--shadow-sm); }
    .choice.active { border-color: var(--brand); background: var(--brand-pale); color: var(--brand-dark); box-shadow: var(--inset); }
    .notice { border-radius: 14px; background: var(--brand-pale); padding: 11px 12px; color: var(--brand-dark); line-height: 1.8; font-size: 13px; }
    .details { margin-top: 8px; padding: 12px; border-radius: 12px; background: var(--wash); font-size: 12px; line-height: 1.9; color: var(--muted); }
    .success { text-align: center; padding: 30px 20px 18px; }
    .success-mark { display: grid; place-items: center; width: 58px; height: 58px; margin: 0 auto 14px; border-radius: 19px; background: var(--brand); color: #fff; font-size: 26px; box-shadow: 7px 8px 18px rgba(164,20,57,.2), -6px -6px 16px #fff; }
    .status-card { margin: 0 16px 14px; padding: 17px; border-radius: 22px; background: var(--brand-dark); color: white; box-shadow: 7px 8px 18px rgba(118,11,41,.18), -6px -6px 16px #fff; }
    .status-card .muted { color: var(--brand-pale); }
    .timeline { position: relative; margin: 18px 0 4px; padding-right: 26px; }
    .timeline::before { content: ""; position: absolute; right: 7px; top: 8px; bottom: 12px; width: 2px; background: var(--line); }
    .event { position: relative; margin-bottom: 18px; }
    .event::before { content: ""; position: absolute; right: -25px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); box-shadow: 0 0 0 4px var(--paper); }
    .event.done::before { background: var(--brand); }
    .event strong { display: block; margin-bottom: 4px; }
    .problem-link { display: block; width: calc(100% - 32px); margin: 10px 16px; border: 0; background: transparent; color: var(--muted); text-decoration: underline; padding: 12px; }
    .issue-panel { margin: 0 16px; padding: 16px; border: 1px solid var(--line); border-radius: 20px; background: var(--paper); box-shadow: var(--shadow-sm); }
    .issue-options { display: grid; gap: 8px; }
    .issue-option { min-height: 40px; border: 1px solid var(--line); background: var(--paper); border-radius: 13px; padding: 10px 12px; text-align: right; }
    .issue-option.active { border-color: var(--danger); background: var(--brand-pale); box-shadow: var(--inset); }
    .prototype-bar { position: fixed; direction: ltr; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(calc(100% - 24px), 438px); z-index: 20; border-radius: 22px; background: var(--ink); color: white; padding: 7px; box-shadow: 0 16px 40px rgba(47,37,40,.28); }
    .switch-row { display: grid; grid-template-columns: 42px 1fr 42px; gap: 8px; align-items: center; }
    .prototype-bar button { border: 0; border-radius: 14px; min-height: 40px; background: var(--brand-dark); color: white; }
    .variant-name { text-align: center; font-weight: 600; font-size: 11px; }
    .state-line { margin-top: 5px; color: var(--brand-pale); font: 10px/1.5 Consolas, monospace; text-align: center; direction: ltr; }
    .back { width: 40px; height: 40px; border: 0; border-radius: 12px; background: var(--paper); color: var(--ink); font-size: 20px; box-shadow: var(--shadow-sm); }

    /* Variant B: storefront story first, trust and seller identity dominate the entrance. */
    .variant-B .shop-hero { margin: 8px 14px 0; background: var(--paper); padding: 20px; border-radius: 22px; box-shadow: var(--shadow); }
    .variant-B .surface { box-shadow: var(--shadow-sm); }

    /* Variant C: basket-led, dense and utilitarian with a persistent order summary. */
    .variant-C .phone { background: var(--paper); }
    .variant-C .shop-hero { margin: 12px; border: 1px solid var(--line); border-radius: 18px; background: var(--paper); box-shadow: var(--shadow-sm); }
    .variant-C .basket-dock { display: flex; position: sticky; top: 56px; z-index: 4; justify-content: space-between; align-items: center; margin: 0 12px; min-height: 40px; padding: 8px 12px; border: 0; border-radius: 0 0 14px 14px; background: var(--brand-pale); color: var(--brand-dark); font-weight: 600; box-shadow: var(--shadow-sm); }
    .variant-C .step-list { grid-template-columns: 1fr; }
    .variant-C .checkout-step { border-radius: 12px; border-right: 4px solid var(--line); }
    .variant-C .checkout-step.current { border-right-color: var(--brand); }
    @media (min-width: 720px) {
      body { padding: 24px 0; }
      .phone { min-height: calc(100vh - 48px); border-radius: 28px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    // PROTOTYPE — three variants of the buyer journey, switchable via ?variant= on one route.
    const variants = {
      A: 'خرید سریع و خطی',
      B: 'فروشگاه و اعتماد در ابتدا',
      C: 'سبد همیشه در دسترس'
    };
    const state = {
      screen: 'store',
      qty: 0,
      authenticated: false,
      otpSent: false,
      addressDone: false,
      shippingDone: false,
      paymentDetails: false,
      issueOpen: false,
      issueType: ''
    };
    let variant = new URLSearchParams(location.search).get('variant')?.toUpperCase() || 'A';
    if (!variants[variant]) variant = 'A';

    const money = value => new Intl.NumberFormat('fa-IR').format(value) + ' تومان';
    const header = (back = false) => `
      <header class="topbar">
        <div class="brand"><span class="brand-mark">س</span><span>سوو</span></div>
        ${back ? '<button class="back" data-action="back" aria-label="بازگشت">→</button>' : '<button class="icon-btn" aria-label="جست‌وجو">⌕</button>'}
      </header>`;

    function paymentBadge() {
      return '<button class="pay-badge" data-action="payment-details">پرداخت مستقیم</button>';
    }

    function statIcon(name) {
      const paths = {
        followers: '<path d="M8 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM2.5 16c.4-3 2.2-4.5 5.5-4.5s5.1 1.5 5.5 4.5M13 5.5a2.5 2.5 0 0 1 0 5M14.5 12c1.8.5 2.8 1.8 3 4"/>',
        purchases: '<path d="M4 7h12l-1 10H5L4 7ZM7 7a3 3 0 0 1 6 0M7.5 12l1.7 1.7 3.4-3.4"/>',
        rating: '<path d="m10 2 2.4 4.9 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4-3.9-3.8 5.4-.8L10 2Z"/>'
      };
      return `<svg viewBox="0 0 20 20" aria-hidden="true">${paths[name]}</svg>`;
    }

    function shopHero() {
      return `<section class="shop-hero">
        <div class="shop-line"><div class="avatar">ن</div><div><h1>نخل استودیو</h1><p class="muted">پوشاک روزمره، دوخته‌شده در شیراز</p></div></div>
        <div class="shop-stats" aria-label="آمار عمومی فروشگاه">
          <span class="shop-stat" title="۱۲ هزار و ۴۰۰ دنبال‌کننده" aria-label="۱۲ هزار و ۴۰۰ دنبال‌کننده">${statIcon('followers')}<span>۱۲٫۴K</span></span>
          <span class="shop-stat" title="۸۴۲ خرید تأییدشده" aria-label="۸۴۲ خرید تأییدشده">${statIcon('purchases')}<span>۸۴۲</span></span>
          <span class="shop-stat" title="امتیاز ۴٫۸ از ۵ از خریداران دارای خرید تأییدشده" aria-label="امتیاز ۴٫۸ از ۵ از خریداران دارای خرید تأییدشده">${statIcon('rating')}<span>۴٫۸</span></span>
        </div>
        ${paymentBadge()}
        ${state.paymentDetails ? '<div class="details">پرداخت شما مستقیم به فروشگاه انجام می‌شود. سوو درخواست مشکل را ثبت و پیگیری می‌کند؛ بازگشت وجه بر اساس شرایط فروشگاه انجام می‌شود.</div>' : ''}
      </section>`;
    }

    function basketDock() {
      if (variant !== 'C' || !state.qty) return '';
      return `<button class="basket-dock" data-action="cart"><span>سبد شما</span><span>${state.qty} کالا · ${money(state.qty * 1280000)}</span></button>`;
    }

    function storeScreen() {
      return `${header()}${basketDock()}${shopHero()}
        <section class="profile-grid-section" aria-label="محتوای فروش نخل استودیو">
          <div class="profile-grid">
            ${Array.from({length: 9}, (_, index) => `<button class="post-tile" data-action="product" aria-label="باز کردن محتوای فروش ${index + 1}"><span class="post-art"></span></button>`).join('')}
          </div>
        </section>`;
    }

    function productScreen() {
      return `${header(true)}${basketDock()}
        <article>
          <div class="post-media" aria-label="تصویر محتوای فروش"><span class="media-dots"><i class="active"></i><i></i><i></i></span></div>
          <section class="post-caption">
            <div class="caption-shop"><span class="caption-avatar">ن</span><strong>نخل استودیو</strong></div>
            <p class="caption-copy"><strong>نخل استودیو</strong> پیراهن لینن آویسا؛ خنک و سبک برای روزهای گرم. این رنگ زیتونی با پارچه لینن نرم دوخته شده و سفارش تا دو روز کاری آماده می‌شود.</p>
            <div class="attached-product">
              <span class="attached-label">کالای متصل</span>
              <div class="attached-heading"><h1>پیراهن لینن آویسا</h1><div class="price">${money(1280000)}</div></div>
              <strong>رنگ</strong><div class="chips" style="margin:8px 0 14px"><button class="chip active">زیتونی</button><button class="chip">کرم</button><button class="chip">آبی</button></div>
              <strong>اندازه</strong><div class="chips" style="margin-top:8px"><button class="chip">۳۶</button><button class="chip active">۳۸</button><button class="chip">۴۰</button></div>
              ${paymentBadge()}${state.paymentDetails ? '<div class="details">پرداخت شما مستقیم به فروشگاه انجام می‌شود. شرایط بازگشت کالا پیش از پرداخت در دسترس است.</div>' : ''}
            </div>
          </section>
        </article>
        <div class="sticky-action"><button class="primary" data-action="add">افزودن به سبد · ${money(1280000)}</button></div>`;
    }

    function cartScreen() {
      return `${header(true)}<section class="section"><h1>سبد خرید</h1><p class="muted">این سفارش فقط از نخل استودیو است.</p></section>
        <section class="surface"><div class="cart-row"><div class="thumb"></div><div><strong>پیراهن لینن آویسا</strong><div class="muted">زیتونی · اندازه ۳۸</div></div><div class="qty"><button data-action="minus">−</button><strong>${state.qty}</strong><button data-action="plus">+</button></div></div>
          <div class="totals"><div class="total-line"><span>جمع کالا</span><strong>${money(state.qty * 1280000)}</strong></div><div class="total-line"><span>ارسال</span><span class="muted">در مرحله بعد</span></div><div class="total-line final"><span>جمع فعلی</span><span>${money(state.qty * 1280000)}</span></div></div>
        </section>
        <section class="surface notice">برای ادامه فقط شماره موبایل شما را تأیید می‌کنیم؛ سبدتان حفظ می‌شود.</section>
        <div class="sticky-action"><button class="primary" data-action="continue">ادامه برای ثبت سفارش</button></div>`;
    }

    function loginScreen() {
      return `${header(true)}<section class="section"><div style="padding-top:32px"><span class="brand-mark" style="width:54px;height:54px;font-size:22px">س</span></div>
        <h1 style="margin-top:24px">${state.otpSent ? 'کد تأیید را وارد کنید' : 'برای ادامه، شماره موبایل'}</h1>
        <p class="muted">${state.otpSent ? 'کد شش‌رقمی برای ۰۹۱۲•••۴۵۶۷ فرستاده شد. سبد شما همین‌جا می‌ماند.' : 'برای ثبت و پیگیری سفارش به حساب خریدار نیاز دارید.'}</p>
        <div class="field"><label>${state.otpSent ? 'کد تأیید' : 'شماره موبایل'}</label><input class="${state.otpSent ? 'otp' : ''}" value="${state.otpSent ? '۱۲۳۴۵۶' : '۰۹۱۲۱۲۳۴۵۶۷'}" inputmode="numeric"></div>
        <button class="primary" data-action="auth">${state.otpSent ? 'تأیید و ادامه' : 'دریافت کد'}</button>
        ${state.otpSent ? '<button class="link" style="width:100%;margin-top:18px">ارسال دوباره کد</button>' : ''}
      </section>`;
    }

    function step(title, number, done, body, key) {
      return `<article class="checkout-step ${!done ? 'current' : ''}"><button class="checkout-title"><span>${title}</span><span class="step-number">${done ? '✓' : number}</span></button><div class="checkout-body">${body}</div></article>`;
    }

    function checkoutScreen() {
      const address = state.addressDone
        ? '<div class="notice">شیراز، بلوار چمران، کوچه ۱۲ <button class="link">تغییر</button></div>'
        : '<div class="field"><label>نشانی تحویل</label><input value="شیراز، بلوار چمران، کوچه ۱۲"></div><button class="secondary" data-action="address">ثبت این نشانی</button>';
      const shipping = !state.addressDone ? '<p class="muted">پس از ثبت نشانی نمایش داده می‌شود.</p>'
        : state.shippingDone ? '<div class="notice">پست پیشتاز · تحویل حدود ۳ تا ۵ روز کاری <button class="link">تغییر</button></div>'
        : '<button class="choice active" data-action="shipping"><span><strong>پست پیشتاز</strong><br><span class="muted">حدود ۳ تا ۵ روز کاری</span></span><strong>۸۵٬۰۰۰ تومان</strong></button><button class="choice"><span>ارسال اقتصادی</span><strong>۵۵٬۰۰۰ تومان</strong></button>';
      const payment = !state.shippingDone ? '<p class="muted">پس از انتخاب ارسال نمایش داده می‌شود.</p>'
        : `<div class="notice"><strong>پرداخت مستقیم به فروشگاه</strong><br>پرداخت شما مستقیم به نخل استودیو انجام می‌شود.</div><button class="link" data-action="payment-details" style="margin-top:10px">شرایط بازگشت و پیگیری</button>${state.paymentDetails ? '<div class="details">سوو درخواست مشکل را ثبت و پیگیری می‌کند. بازگشت وجه بر اساس شرایط فروشگاه انجام می‌شود.</div>' : ''}`;
      return `${header(true)}${basketDock()}<section class="section"><h1>ثبت سفارش</h1><p class="muted">یک صفحه، سه قدم کوتاه</p>
        <div class="step-list">
          ${step('نشانی تحویل', 1, state.addressDone, address)}
          ${step('روش ارسال', 2, state.shippingDone, shipping)}
          ${step('مرور و پرداخت', 3, false, payment)}
        </div></section>
        <section class="surface"><div class="total-line"><span>کالا و ارسال</span><strong>${money(state.qty * 1280000 + (state.shippingDone ? 85000 : 0))}</strong></div></section>
        ${state.shippingDone ? '<div class="sticky-action"><button class="primary" data-action="pay">ثبت و پرداخت سفارش</button></div>' : ''}`;
    }

    function trackingScreen() {
      return `${header()}<section class="success"><div class="success-mark">✓</div><h1>سفارش ثبت شد</h1><p class="muted">لینک پیگیری برای شما پیامک شد.</p></section>
        <section class="status-card"><div class="muted">وضعیت اکنون</div><h2 style="margin:8px 0">فروشگاه در حال آماده‌کردن سفارش است</h2><p class="muted" style="margin:0">نخل استودیو تا دو روز آینده کد رهگیری را ثبت می‌کند.</p></section>
        <section class="surface"><div class="section-head"><h2>پیگیری سفارش</h2><span class="muted">#سوو-۲۸۴۱</span></div>
          <div class="timeline"><div class="event done"><strong>سفارش ثبت شد</strong><span class="muted">امروز، ۱۱:۲۴</span></div><div class="event done"><strong>پرداخت انجام شد</strong><span class="muted">مستقیم به نخل استودیو</span></div><div class="event"><strong>آماده‌سازی سفارش</strong><span class="muted">قدم بعدی با فروشگاه است</span></div><div class="event"><strong>ارسال و کد رهگیری</strong></div></div>
          <button class="secondary">گفت‌وگو با فروشگاه</button>
        </section>
        <button class="problem-link" data-action="problem">برای این سفارش مشکلی پیش آمده؟</button>
        ${state.issueOpen ? issuePanel() : ''}`;
    }

    function issuePanel() {
      return `<section class="issue-panel"><h2>چه مشکلی پیش آمده؟</h2><p class="muted">انتخاب شما به همین سفارش متصل می‌شود.</p><div class="issue-options">
        ${['سفارش دیر رسیده', 'کالا آسیب دیده', 'کالا با توضیحات متفاوت است'].map(item => `<button class="issue-option ${state.issueType === item ? 'active' : ''}" data-action="issue" data-value="${item}">${item}</button>`).join('')}
      </div>${state.issueType ? '<div class="notice" style="margin-top:12px">می‌توانید ابتدا با فروشگاه گفت‌وگو کنید یا همین حالا موضوع را برای پیگیری سوو ثبت کنید.</div><div style="display:grid;gap:8px;margin-top:10px"><button class="secondary">گفت‌وگو با فروشگاه</button><button class="primary">ثبت برای پیگیری سوو</button></div>' : ''}</section>`;
    }

    function currentScreen() {
      return ({ store: storeScreen, product: productScreen, cart: cartScreen, login: loginScreen, checkout: checkoutScreen, tracking: trackingScreen })[state.screen]();
    }

    function switcher() {
      const prototypeVisible = ['localhost', '127.0.0.1', ''].includes(location.hostname) || new URLSearchParams(location.search).get('prototype') === '1';
      if (!prototypeVisible) return '';
      return `<aside class="prototype-bar"><div class="switch-row"><button data-action="previous">←</button><div class="variant-name">${variant} — ${variants[variant]}</div><button data-action="next">→</button></div><div class="state-line">screen=${state.screen} · auth=${state.authenticated} · cart=${state.qty} · payment=direct</div></aside>`;
    }

    function render() {
      document.getElementById('app').innerHTML = `<div class="variant-${variant}"><div class="phone">${currentScreen()}</div>${switcher()}</div>`;
      document.title = `${variant} — ${variants[variant]} | سوو`;
    }

    function setVariant(next) {
      variant = next;
      const params = new URLSearchParams(location.search);
      params.set('variant', variant);
      history.replaceState({}, '', `${location.pathname}?${params}`);
      render();
    }

    function cycle(direction) {
      const keys = Object.keys(variants);
      const index = keys.indexOf(variant);
      setVariant(keys[(index + direction + keys.length) % keys.length]);
    }

    document.addEventListener('click', event => {
      const target = event.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      if (action === 'product') state.screen = 'product';
      if (action === 'add') { state.qty = Math.max(1, state.qty + 1); state.screen = 'cart'; }
      if (action === 'cart' && state.qty) state.screen = 'cart';
      if (action === 'plus') state.qty += 1;
      if (action === 'minus') state.qty = Math.max(1, state.qty - 1);
      if (action === 'continue') state.screen = state.authenticated ? 'checkout' : 'login';
      if (action === 'auth' && !state.otpSent) state.otpSent = true;
      else if (action === 'auth' && state.otpSent) { state.authenticated = true; state.screen = 'checkout'; }
      if (action === 'address') state.addressDone = true;
      if (action === 'shipping') state.shippingDone = true;
      if (action === 'payment-details') state.paymentDetails = !state.paymentDetails;
      if (action === 'pay') state.screen = 'tracking';
      if (action === 'problem') state.issueOpen = !state.issueOpen;
      if (action === 'issue') state.issueType = target.dataset.value;
      if (action === 'previous') cycle(-1);
      if (action === 'next') cycle(1);
      if (action === 'back') {
        state.screen = ({ product: 'store', cart: 'product', login: 'cart', checkout: 'cart' })[state.screen] || 'store';
      }
      render();
    });

    document.addEventListener('keydown', event => {
      if (!['ArrowLeft', 'ArrowRight'].includes(event.key)) return;
      if (event.target.matches('input, textarea, [contenteditable]')) return;
      cycle(event.key === 'ArrowLeft' ? -1 : 1);
    });

    render();
  </script>
</body>
</html>
