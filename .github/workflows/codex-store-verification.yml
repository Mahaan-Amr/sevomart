name: Temporary navigation visual verification
on:
  push:
    branches: [fix/266-browser-probe]
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm exec playwright install --with-deps chromium
      - name: Render candidate visual baselines
        run: pnpm test:e2e -- tests/e2e/store-builder.spec.ts tests/e2e/storefront-visual.spec.ts --retries=0 --grep 'seller builds, refreshes, previews and publishes a minimal store'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navigation-visual-candidate
          path: |
            tests/e2e/__screenshots__/store-builder.spec.ts/*/*.png
            tests/e2e/__screenshots__/storefront-visual.spec.ts/*/storefront-*.png
          if-no-files-found: error
