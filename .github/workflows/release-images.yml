name: Release versioned images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Human-readable immutable release tag (for example v0.3.0-rc.1)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sevo
          POSTGRES_PASSWORD: sevo_local
          POSTGRES_USER: sevo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sevo -d sevo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      DATABASE_URL: postgresql://sevo:sevo_local@localhost:5432/sevo
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm quality

  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: worker
            dockerfile: apps/worker/Dockerfile
          - name: migrate
            dockerfile: packages/database/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve immutable image tags
        id: tags
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          release_tag="${INPUT_TAG:-$REF_TAG}"
          echo "release=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sevo-${{ matrix.name }}:${release_tag}" >> "$GITHUB_OUTPUT"
          echo "sha=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sevo-${{ matrix.name }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build the release candidate for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: sevo-${{ matrix.name }}:release-candidate
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Block fixed high or critical image vulnerabilities
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
          image
          --db-repository ghcr.io/aquasecurity/trivy-db:2
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          sevo-${{ matrix.name }}:release-candidate
      - name: Build and publish ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.tags.outputs.release }}
            ${{ steps.tags.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
