name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sevo
          POSTGRES_PASSWORD: sevo_local
          POSTGRES_USER: sevo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sevo -d sevo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      DATABASE_URL: postgresql://sevo:sevo_local@localhost:5432/sevo
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Start MinIO integration service
        run: |
          docker build --file ops/minio/Dockerfile --tag sevo-local-minio:RELEASE.2025-04-22T22-12-26Z .
          docker run --detach --name sevo-ci-minio \
            --publish 9100:9000 \
            --env MINIO_ROOT_USER=sevo_local \
            --env MINIO_ROOT_PASSWORD=sevo_local_password \
            sevo-local-minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:9100/minio/health/live; then
              exit 0
            fi
            sleep 1
          done
          docker logs sevo-ci-minio
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm quality
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run discovery and storefront layout tests
        id: playwright-grid
        run: pnpm exec playwright test --config playwright.grid.config.ts
      - name: Upload grid test failure artifacts
        if: failure() && steps.playwright-grid.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-grid-failure-${{ github.run_id }}
          path: output/playwright-grid-results
          if-no-files-found: error
          retention-days: 14
      - name: Run Playwright acceptance and visual regression
        id: playwright
        run: pnpm test:e2e
      - name: Upload Playwright failure artifacts
        if: failure() && steps.playwright.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            output/playwright-report
            output/playwright-results
          if-no-files-found: error
          retention-days: 14

  superadmin-recovery-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start disposable PostgreSQL and apply migrations
        run: |
          docker compose -p sevo-recovery-ci up -d --build --wait postgres
          docker compose -p sevo-recovery-ci run --rm migrate
      - name: Provision restricted recovery credential
        run: |
          docker compose -p sevo-recovery-ci exec -T postgres psql -v ON_ERROR_STOP=1 -U sevo -d sevo < ops/security/provision-superadmin-recovery.sql
          docker compose -p sevo-recovery-ci exec -T postgres psql -v ON_ERROR_STOP=1 -U sevo -d sevo <<'SQL'
          CREATE ROLE recovery_ci LOGIN PASSWORD 'ci-only-recovery-password';
          GRANT sevo_superadmin_recovery TO recovery_ci;
          INSERT INTO identity_identities (id, status) VALUES ('11111111-1111-4111-8111-111111111111', 'ACTIVE');
          SQL
      - name: Build and exercise the recovery operator
        env:
          SEVO_RECOVERY_DATABASE_URL: postgresql://recovery_ci:ci-only-recovery-password@postgres:5432/sevo
        run: |
          docker compose -p sevo-recovery-ci --profile recovery build superadmin-recovery
          printf '%s' '{"identityId":"11111111-1111-4111-8111-111111111111","reason":"بازیابی مدیریت پس از قطع دسترسی","idempotencyKey":"22222222-2222-4222-8222-222222222222"}' | docker compose -p sevo-recovery-ci --profile recovery run --rm --no-deps -T superadmin-recovery
          printf '%s' '{"identityId":"11111111-1111-4111-8111-111111111111","reason":"آماده‌سازی ورود امن مدیر جدید","idempotencyKey":"33333333-3333-4333-8333-333333333333"}' | docker compose -p sevo-recovery-ci --profile recovery run --rm --no-deps -T superadmin-recovery scripts/authorize-superadmin-totp.mjs
          docker compose -p sevo-recovery-ci exec -T postgres psql -U sevo -d sevo -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO identity_totp_factors (identity_id, enrollment_session_id, key_id, ciphertext, nonce, tag, status, expires_at)
          VALUES ('11111111-1111-4111-8111-111111111111', '44444444-4444-4444-8444-444444444444', 'ci', decode('00','hex'), decode('00','hex'), decode('00','hex'), 'ACTIVE', now() + interval '1 day');
          SQL
          printf '%s' '{"identityId":"11111111-1111-4111-8111-111111111111","username":"ci.owner","password":"ci-only-owner-password","reason":"بازیابی دسترسی مدیر از مسیر مالک","idempotencyKey":"55555555-5555-4555-8555-555555555555"}' | docker compose -p sevo-recovery-ci --profile recovery run --rm --no-deps -T superadmin-recovery scripts/recover-superadmin-password.mjs
          docker compose -p sevo-recovery-ci up -d --build --wait api
          curl --fail --silent --show-error -o /dev/null -X POST -H 'content-type: application/json' --data '{"identifier":"ci.owner","password":"ci-only-owner-password"}' http://127.0.0.1:3101/v2/platform/auth/password/sessions
          if docker compose -p sevo-recovery-ci exec -T -e PGPASSWORD=ci-only-recovery-password postgres psql -h 127.0.0.1 -U recovery_ci -d sevo -v ON_ERROR_STOP=1 -c "UPDATE identity_platform_superadmins SET revoked_at = now()"; then
            echo "Recovery credential unexpectedly wrote role table" >&2
            exit 1
          fi
          docker compose -p sevo-recovery-ci exec -T postgres psql -U sevo -d sevo -v ON_ERROR_STOP=1 -c "SELECT 1 / CASE WHEN count(*) = 2 THEN 1 ELSE 0 END FROM identity_platform_superadmin_audit WHERE actor_kind = 'OWNER_RECOVERY' AND action IN ('RECOVERED', 'TOTP_ENROLLMENT_AUTHORIZED')"
      - name: Start complete Compose stack with the notification worker
        run: |
          docker compose -p sevo-recovery-ci up -d --build --wait
          docker compose -p sevo-recovery-ci exec -T worker node -e "fetch('http://127.0.0.1:3002/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
          docker compose -p sevo-recovery-ci exec -T postgres psql -v ON_ERROR_STOP=1 -U sevo -d sevo -c "SELECT event_id, application_id, state, updated_at FROM notifications_seller_approval LIMIT 0"
      - name: Start native development path against disposable infrastructure
        run: |
          cp .env.example .env
          export COMPOSE_PROJECT_NAME=sevo-recovery-ci
          setsid pnpm dev > "$RUNNER_TEMP/sevo-native.log" 2>&1 &
          native_pid=$!
          trap 'kill -- -"$native_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 120); do
            if curl -fsS -o /dev/null http://127.0.0.1:3201/health/ready && curl -fsS -o /dev/null http://127.0.0.1:3202/health/ready && curl -fsS -o /dev/null http://127.0.0.1:3200/health; then
              exit 0
            fi
            if ! kill -0 "$native_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          echo "Native development services did not become ready" >&2
          exit 1
      - name: Remove disposable stack
        if: always()
        run: docker compose -p sevo-recovery-ci down --volumes --remove-orphans

  container-images:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: worker
            dockerfile: apps/worker/Dockerfile
          - name: migrate
            dockerfile: packages/database/Dockerfile
          - name: superadmin-recovery
            dockerfile: ops/security/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.name }} image from the production Dockerfile
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: sevo-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Block fixed high or critical image vulnerabilities
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f
          image
          --db-repository ghcr.io/aquasecurity/trivy-db:2
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          sevo-${{ matrix.name }}:${{ github.sha }}
